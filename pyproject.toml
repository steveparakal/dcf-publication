[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dcf"
version = "1.2.0"
description = "Domain Characterization Framework (DCF) — multi-domain time-series characterization, Domain Profile construction, forecasting-behavior analysis, and relationship discovery."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
    { name = "DCF Publication Code" }
]
keywords = [
    "time-series",
    "forecasting",
    "domain-characterization",
    "structural-change",
    "trend-analysis",
]

dependencies = [
    "numpy>=1.26,<2.1",
    "pandas>=2.1,<2.3",
    "scipy>=1.11,<1.14",
    "statsmodels>=0.14,<0.16",

    "ruptures>=1.1,<1.2",
    "scikit-learn>=1.3,<1.6",
    "xgboost>=2.0,<3.0",
    "pmdarima>=2.0,<2.1",

    "torch>=2.1,<2.5",

    "requests>=2.31,<3.0",
    "pandas-datareader>=0.10,<0.11",
    "yfinance>=0.2.40,<0.3",

    "PyYAML>=6.0,<7.0",
    "openpyxl>=3.1,<3.2",

    "matplotlib>=3.8,<3.10",
    "seaborn>=0.13,<0.14",

    "tqdm>=4.66,<5.0",
    "joblib>=1.3,<1.5",
    "loguru>=0.7,<0.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9.0",
    "pytest-cov>=4.1,<6.0",
]
viz = [
    "plotly>=5.18,<6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["dcf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "real_data: marks tests requiring actual dataset files (deselect with '-m \"not real_data\"')",
]

[tool.coverage.run]
source = ["src/dcf"]
omit = ["*/tests/*"]
