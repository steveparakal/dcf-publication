  Beijing_PM25:
    reader_facing_name: Beijing PM2.5
    technical_id: Beijing_PM25
    accepted_prepared_sha256: 86d70852d1f003a356f2cc21e969ebfd03e1a87d39db7d689965494a1010da91
    provider: 'UCI Machine Learning Repository #501 (Zhang et al., 2017)'
    canonical_source_url: https://archive.ics.uci.edu/dataset/501
    target_variable: PM2.5_daily_mean_Dongsi — Dongsi station daily mean PM2.5 (µg/m³)
    station: Dongsi
    frequency: daily
    accepted_date_start: '2013-03-01'
    accepted_date_end: '2017-02-28'
    accepted_n: 1461
    source_note: 'The accepted publication dataset is the Beijing Multi-Site Air-Quality
      Data (UCI #501, Zhang et al. 2017), Dongsi station, daily mean PM2.5, 2013-03-01
      to 2017-02-28. Do NOT use UCI #381 (PRSA_data_2010.1.1-2014.12.31.csv), which
      is a different dataset covering a different period. The accepted raw file is
      the pre-aggregated daily CSV produced by scripts/preprocess_beijing_pm25.py
      from the UCI #501 multi-site raw files.

      '
    raw_filename: Beijing_PM25_daily.csv
    raw_path: data/raw/Beijing_PM25/Beijing_PM25_daily.csv
    acquisition_method: manual_with_preprocessing
    instructions: "1. Download the Beijing Multi-Site Air-Quality Data (UCI #501)\
      \ from\n   https://archive.ics.uci.edu/dataset/501\n2. Extract the multi-station\
      \ hourly CSV files. 3. Run: python scripts/preprocess_beijing_pm25.py\n   to\
      \ produce the Dongsi daily mean series at data/raw/Beijing_PM25/Beijing_PM25_daily.csv\n\
      4. Run: python -c \"from dcf.data_preparation import prepare_dataset; prepare_dataset('Beijing_PM25')\"\
      \n"
    preprocessing_script: scripts/preprocess_beijing_pm25.py
    preparation_function: dcf.data_preparation.prepare_dataset('Beijing_PM25')
    redistribution_status: permitted
    raw_data_included_in_release: false
    leakage_disclosure: 'Two (origin, interpolated-position) pairs have bounded short-gap
      interpolation where the right-hand source lies 1-2 days beyond the training
      cutoff: origin 15 (2016-07-28 cutoff, right-source 2016-07-30) and origin 28
      (2017-02-02 cutoff, right-source 2017-02-03). Disclosed in manuscript Sections
      4.3 and 4.6.

      '
    attribution: 'Zhang, S. et al. (2017). Beijing Multi-Site Air-Quality Data. UCI
      #501.'
